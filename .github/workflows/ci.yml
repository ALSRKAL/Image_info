name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Smoke test the CLI
        run: |
          imageinfo --version
          imageinfo demo --dir demo_out
          imageinfo info demo_out/petra_sunset.jpg
          imageinfo privacy demo_out/petra_sunset.jpg
          imageinfo strip demo_out/petra_sunset.jpg -o clean.jpg
